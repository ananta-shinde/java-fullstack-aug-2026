<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <section>
        <div class="container">
            <div id="postContainer" class="row">
              
            </div>
        </div>
    </section>
</body>
<script>

   async function loadposts(){
    // hit an url(api) and get response
      const response = await  fetch("https://dummyjson.com/posts");
      const data = await response.json();
      const posts = data.posts;

      for(i=0;i<posts.length;i++){
          
           let tagStructure = ""
           for(j=0;j<posts[i].tags.length;j++){
                tagStructure = tagStructure +  `<span class="badge bg-secondary mx-2">${posts[i].tags[j]}</span>`
           }
           
           
           postContainer.innerHTML = postContainer.innerHTML+
           `<div class="col-9 p-4">
                    <div class="card p-4">
                        <h1>${posts[i].title}</h1>
                        <p>${posts[i].body}</p>
                        <p>${tagStructure}</p>
                         <div>
                            <label>Likes :</label><span>${posts[i].reactions.likes}</span>
                         <label class="ms-5">Dislikes :</label><span>${posts[i].reactions.dislikes}</span>
                        </div>
                    </div>
                </div>`
      }

    }


    loadposts()
</script>
</html>
