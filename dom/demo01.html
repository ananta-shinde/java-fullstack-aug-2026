
<html lang="en" >
<head>
    <title>Document</title>
</head>
<body>
   
    <section>
        <input id="fullname" type="text" placeholder="full name"/>
        <input id="email" type="text" placeholder="email"/>
        <input id="password" type="password" placeholder="password"/>
        <input id="confirmPasword" type="text" placeholder="confirm password"/>
        <input type="submit" onclick="handleSubmit()">
        <button onclick="printData()">printData</button>
    </section>
     <table id="usertable">
        <tr>
            <th>name</th>
            <th>email</th>
            <th>password</th>
        </tr>
    </table> 
   
</body>
<script>
   userdata = []
  function handleSubmit(){
    data = {}
    data.name = fullname.value
    data.email = email.value
    data.password = password.value
    // userdata.push(fullname.value)
    // userdata.push(email.value)
    userdata.push(data)
  }

  function printData(){
    console.log(userdata)
     
    for(i=0;i<userdata.length;i++){

         usertable.innerHTML = usertable.innerHTML +
    `<tr>
            <th>${userdata[i].name}</th>
            <th>${userdata[i].email}</th>
            <th>${userdata[i].password}</th>
    </tr>
    `
    }

    
  }




   
</script>
</html>
