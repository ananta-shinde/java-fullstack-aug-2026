<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <section class="bg-light p-5" >
        <h1 class="h3 w-50 text-center mx-auto text-muted">Todyapp  your personal digital assistance to manage your schedule</h1>
         <div class="d-flex justify-content-center align-items-start pt-5" style="height: 100vh;">

            <form class="border p-3 col-4 shadow " style="height: fit-content;">
                <h1 class="h4 text-center my-3">Welcome to Todyapp</h1>
                <input class="form-control mb-2" type="text" placeholder="Fullname"/>
                <input class="form-control mb-2" type="text" placeholder="Email"/>
                <input class="form-control mb-2" type="password" placeholder="Password"/>
                <input class="form-control mb-2" type="password" placeholder="Confirm Password"/>
                <button class="btn btn-warning">Register</button>
            </form>
         </div>
    </section>
</body>
</html>
